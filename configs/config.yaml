api:
  piezometer:
    provider: "hubeau"
    url_station: "https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/stations"
    url_piezometre: "https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques"
    code_bss: 
      - "10906X0039/C2-1"
  weather:
    provider: "open-meteo"
    url_archive: "https://archive-api.open-meteo.com/v1/archive"
    url_forecast: ""
    start_date: "2017-01-01"
    
paths:
  data:
    raw: "data/raw"
    interim: "data/interim"
    processed: "data/processed"
    external: "data/external"
  raw_filename: "dataset.csv"
  weather:
    interim_filename: "weather_cleaned.csv"
  piezometer:
    interim_filename: "piezometer_cleaned.csv"

s3:
  bucket: "nappe-forecast"
  prefixes:
    processed: "data/processed"
    interim: "data/interim"
    raw: "data/raw"
    external: "data/external"