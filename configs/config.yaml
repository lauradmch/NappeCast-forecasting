api:
  piezometer:
    provider: "hubeau"
    url_station: "https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/stations"
    url_piezometre: "https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques"
    code_bss: 
      - "10906X0039/C2-1"
  weather:
    provider: "open-meteo"
    url_archive: "https://archive-api.open-meteo.com/v1/archive"
    url_forecast: ""
    start_date: "2017-01-01"
  forecast_horizon: 30
  model_source: "mlflow"
    
paths:
  data:
    raw: "data/raw"
    interim: "data/interim"
    processed: "data/processed"
    external: "data/external"
  models: "models"

  local_model_filenames:
    #XGBoost: "xgboost.joblib"
    Prophet: "prophet.joblib"


  interim_filename: "dataset_interim" 
  processed_filename: "dataset_processed"
  weather:
    raw_filename: "weather_raw"
    interim_filename: "weather_cleaned"
  station:
    raw_filename: "station_raw"
  piezometer:
    raw_filename: "piezometer_raw"
    interim_filename: "piezometer_cleaned"
  
s3:
  bucket: "nappecast"
  prefixes:
    processed: "data/processed"
    interim: "data/interim"
    raw: "data/raw"
    external: "data/external"

model:
  Linear:
    type: "LinearRegression"
    params:
      fit_intercept: true
  XGBoost:
    type: "XGBRegressor"
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
  prophet:
    type: "Prophet"

    params:
      h14:
        yearly_seasonality: true
        weekly_seasonality: false
        daily_seasonality: false
        changepoint_prior_scale: 0.05
      h30:
        yearly_seasonality: true
        weekly_seasonality: false
        daily_seasonality: false
        changepoint_prior_scale: 0.05
    data :
      features :
        - "shortwave_radiation_sum"
        - "et0_fao_evapotranspiration"
        - "soil_temperature_0_to_100cm_mean"
        - "P_cum_90d"
        - "Peff_cum_90d"
        - "Temperature_mean_90d"
      target : "niveau_nappe_eau"
      
training:
  test_size: 30
  random_state: 42
  cv_folds: 5
  scoring: "accuracy"

mlflow:
  experiment_name: "nappecast"
  default_tracking_uri: "http://51.45.56.7:5000"
  internal_tracking_uri: "http://172.31.32.79:5000" 
  active_model: "Prophet"
  model_alias: "production"
  registered_model_name:
    h14:
      #XGBoost: "nappecast_XGBoost_h14"
      Prophet: "nappecast_Prophet_h14"
    h30:
      #XGBoost: "nappecast_XGBoost_h30"
      Prophet: "nappecast_Prophet_h30"

system:
  logging_format: "%(asctime)s [%(levelname)s] %(message)s"
