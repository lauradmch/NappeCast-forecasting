# Configuration Airflow (CeleryExecutor + Redis + PostgreSQL) pour déploiement EC2.
#
# Variables d'environnement à définir dans un fichier .env à côté de ce fichier :
#
# AIRFLOW_UID                  - UID à utiliser dans les containers Airflow (id -u sur l'hôte EC2)
# AIRFLOW_IMAGE_NAME            - Image Airflow si vous n'utilisez pas de build local
# S3_BUCKET                     - Nom du bucket S3 utilisé pour la synchro (obligatoire)
# DAGS_S3_PREFIX                - Préfixe/dossier des DAGs dans le bucket (défaut: dags)
#                                  Sens : S3 -> EC2 (pull, S3 fait autorité, --delete actif)
# DATA_S3_PREFIX                - Préfixe/dossier data dans le bucket (défaut: data)
#                                  Sens : EC2 -> S3 (push, sauvegarde, pas de --delete)
# LOGS_S3_PREFIX                - Préfixe/dossier logs dans le bucket (défaut: logs)
#                                  Sens : EC2 -> S3 (push, sauvegarde, pas de --delete)
# AWS_REGION                    - Région AWS du bucket (défaut: eu-west-1)
# SYNC_INTERVAL_SECONDS          - Intervalle de synchro en secondes (défaut: 60)
# _AIRFLOW_WWW_USER_USERNAME    - Compte admin (défaut: airflow)
# _AIRFLOW_WWW_USER_PASSWORD    - Mot de passe admin (défaut: airflow)
---
version: '3'
x-airflow-common:
  &airflow-common
  # image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.3.2}
  build: .
  env_file:
    - ../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    env_file:
    - ../.env
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        airflow_version=$$(gosu airflow airflow version)
        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.2.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})
        if (( airflow_version_comparable < min_airflow_version_comparable )); then
          echo
          echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
          echo "The minimum Airflow version supported: $${min_airflow_version}. Only use this or higher!"
          echo
          exit 1
        fi
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    # yamllint enable rule:line-length
    env_file:
      - ../.env
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - .:/sources

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - 5555:5555
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --- synchronisation avec S3 ---
  # dags/  : PULL  S3 -> EC2
  # data/  : PUSH  EC2 -> S3
  # logs/  : PUSH  EC2 -> S3

  airflow-s3-sync:
    image: amazon/aws-cli:2.17.62
    container_name: airflow-s3-sync
    restart: always
    env_file:
      - ../.env
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET:?Merci de definir S3_BUCKET dans le fichier .env}
      DAGS_S3_PREFIX: ${DAGS_S3_PREFIX:-dags}
      DATA_S3_PREFIX: ${DATA_S3_PREFIX:-data}
      LOGS_S3_PREFIX: ${LOGS_S3_PREFIX:-logs}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Demarrage de la synchronisation S3 (bucket: ${S3_BUCKET})"
        while true; do
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # dags : PULL S3 -> EC2 (S3 fait autorite)
          if aws s3 sync "s3://${S3_BUCKET}/${DAGS_S3_PREFIX}" /opt/airflow/dags --delete; then
            echo "[$ts] dags  : pull S3 -> EC2 OK"
          else
            echo "[$ts] dags  : ERREUR pull S3 -> EC2"
          fi

          # data : PUSH EC2 -> S3 (sauvegarde, pas de --delete)
          if aws s3 sync /opt/airflow/data "s3://${S3_BUCKET}/${DATA_S3_PREFIX}"; then
            echo "[$ts] data  : push EC2 -> S3 OK"
          else
            echo "[$ts] data  : ERREUR push EC2 -> S3"
          fi

          # logs : PUSH EC2 -> S3 (sauvegarde, pas de --delete)
          if aws s3 sync /opt/airflow/logs "s3://${S3_BUCKET}/${LOGS_S3_PREFIX}"; then
            echo "[$ts] logs  : push EC2 -> S3 OK"
          else
            echo "[$ts] logs  : ERREUR push EC2 -> S3"
          fi

          sleep "${SYNC_INTERVAL_SECONDS}"
        done

volumes:
  postgres-db-volume: