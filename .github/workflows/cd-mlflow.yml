name: cd-mlflow

on:
  push:
    branches: [master]
    paths:
      - 'docker/mlflow/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les fichiers de déploiement
        run: |
          ls -la docker/mlflow/
          for f in docker-compose.yml mlflow.env deploy.sh; do
            test -f "docker/mlflow/$f" || { echo "::error::docker/mlflow/$f absent du commit ${{ github.sha }}"; exit 1; }
          done

      - name: Auth AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::844099234486:role/github-actions-deploy
          aws-region: eu-west-3

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: L'image existe-t-elle déjà ?
        id: img
        run: |
          if aws ecr describe-images --repository-name mlflow \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.img.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        if: steps.img.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mlflow
          push: true
          tags: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rendre le docker-compose.yml avec le tag de cette build
        run: |
          sed -i "s|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:.*|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}|" docker/mlflow/docker-compose.yml
          grep -q "mlflow:${{ github.sha }}" docker/mlflow/docker-compose.yml \
            || { echo "::error::Le tag n'a pas été injecté dans docker-compose.yml"; exit 1; }

      - name: IP publique du runner
        id: ip
        run: |
          IP=$(curl -sf https://checkip.amazonaws.com | tr -d '[:space:]')
          test -n "$IP" || { echo "::error::Impossible de récupérer l'IP du runner"; exit 1; }
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Ouvrir SSH pour ce runner
        id: open_ssh
        env:
          SG_ID: ${{ secrets.MLFLOW_SG_ID }}
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          test -n "$SG_ID" || { echo "::error::MLFLOW_SG_ID non défini"; exit 1; }
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.MLFLOW_EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copier les fichiers sur l'EC2
        env:
          HOST: ${{ secrets.MLFLOW_EC2_HOST }}
          USER: ${{ secrets.MLFLOW_EC2_USER }}
        run: |
          set -e
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $OPTS "$USER@$HOST" 'rm -rf /tmp/mlflow-deploy && mkdir -p /tmp/mlflow-deploy'
          scp $OPTS docker/mlflow/docker-compose.yml docker/mlflow/mlflow.env docker/mlflow/deploy.sh \
              "$USER@$HOST:/tmp/mlflow-deploy/"
          ssh $OPTS "$USER@$HOST" 'ls -la /tmp/mlflow-deploy'

      - name: Déploiement
        env:
          HOST: ${{ secrets.MLFLOW_EC2_HOST }}
          USER: ${{ secrets.MLFLOW_EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$USER@$HOST" 'bash -s' <<'EOF'
          set -e
          sudo mkdir -p /opt/mlflow
          sudo mv /tmp/mlflow-deploy/docker-compose.yml /opt/mlflow/docker-compose.yml
          sudo mv /tmp/mlflow-deploy/mlflow.env         /opt/mlflow/mlflow.env
          sudo mv /tmp/mlflow-deploy/deploy.sh          /opt/mlflow/deploy.sh
          sudo chown appuser:appuser /opt/mlflow/docker-compose.yml /opt/mlflow/mlflow.env /opt/mlflow/deploy.sh
          sudo chmod +x /opt/mlflow/deploy.sh
          sudo /opt/mlflow/deploy.sh
          rm -rf /tmp/mlflow-deploy
          EOF

      - name: Refermer SSH
        if: always() && steps.open_ssh.outcome == 'success'
        env:
          SG_ID: ${{ secrets.MLFLOW_SG_ID }}
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: Supprimer la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/deploy_key