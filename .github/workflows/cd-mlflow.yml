name: cd-mlflow

on:
  push:
    branches: [master]
    paths:
      - 'docker/mlflow/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Auth AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::844099234486:role/github-actions-deploy
          aws-region: eu-west-3

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: L'image existe-t-elle déjà ?
        id: img
        run: |
          if aws ecr describe-images --repository-name mlflow \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.img.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        if: steps.img.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/mlflow
          push: true
          tags: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rendre le docker-compose.yml avec le tag de cette build
        run: |
          sed -i "s|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:.*|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}|" docker/mlflow/docker-compose.yml
      
      - name: IP publique du runner
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Ouvrir SSH pour ce runner
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.MLFLOW_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32

      - name: Copier docker-compose.yml et deploy.sh sur l'EC2 MLflow (SCP, aucun secret applicatif)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MLFLOW_EC2_HOST }}
          username: ${{ secrets.MLFLOW_EC2_USER }}
          key: ${{ secrets.MLFLOW_EC2_SSH_KEY }}
          source: "docker/mlflow/docker-compose.yml,docker/mlflow/.env,docker/mlflow/deploy.sh"
          strip_components: 2
          target: /home/appuser

      - name: Déploiement (SSH, aucun secret transmis)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MLFLOW_EC2_HOST }}
          username: ${{ secrets.MLFLOW_EC2_USER }}
          key: ${{ secrets.MLFLOW_EC2_SSH_KEY }}
          script: |
            set -e
            mv /home/appuser/docker-compose.yml /opt/mlflow/docker-compose.yml
            mv /home/appuser/deploy.sh /opt/mlflow/deploy.sh
            mv /home/appuser/.env /opt/mlflow/.env
            sudo chmod +x /opt/mlflow/deploy.sh
            sudo chown appuser:appuser /opt/mlflow/deploy.sh
            sudo /opt/mlflow/deploy.sh

      - name: Refermer SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.MLFLOW_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32