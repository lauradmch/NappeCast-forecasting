name: cd-mlflow

on:
  push:
    branches: [main]
    paths:
      - 'docker/mlflow/**'

permissions:
  id-token: write
  contents: read


jobs:
  build-and-deploy:
  runs-on: ubuntu-latest
  environment: production
  steps:
    - uses: actions/checkout@v4
    - name: Auth AWS via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::844099234486:role/github-actions-deploy-mlflow
        aws-region: eu-west-3

    - name: Login ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build et push de l'image
      uses: docker/build-push-action@v6
      with:
        context: ./docker/mlflow
        push: true
        tags: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Rendre le docker-compose.yml avec le tag de cette build
      run: |
        sed -i "s|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:.*|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/mlflow:${{ github.sha }}|" docker/mlflow/docker-compose.yml

    - name: Copier docker-compose.yml, .env et deploy.sh sur l'EC2 (SCP, aucun secret applicatif)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.MLFLOW_EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker/mlflow/docker-compose.yml,docker/mlflow/.env,docker/mlflow/deploy.sh"
        strip_components: 1
        target: "~"

    - name: Déploiement (SSH, aucun secret transmis)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.MLFLOW_EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
            sudo mv ~/docker-compose.yml /opt/mlflow/docker-compose.yml
            sudo mv ~/deploy.sh /opt/mlflow/deploy.sh
            sudo chmod +x /opt/mlflow/deploy.sh
            sudo chown appuser:appuser /opt/mlflow/deploy.sh
            sudo /opt/mlflow/deploy.sh