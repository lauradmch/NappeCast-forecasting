name: ci-app_api

on:
  # push:
    # branches: [main, develop]
  # pull_request:
    # branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Étape 1 — cloner le repo sur la machine virtuelle
      - name: Checkout
        uses: actions/checkout@v4

      # Étape 2 — installer Python 3.13 sur la machine virtuelle
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Étape 3 — installer les dépendances du projet
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Étape 4 — lancer les tests
      # -v        : verbose, affiche le nom de chaque test
      # --tb=short : en cas d'échec, affiche un traceback condensé
      - name: Run tests
        run: pytest tests/ -v --tb=short

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Auth AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::844099234486:role/github-actions-deploy
          aws-region: eu-west-3

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: L'image api existe-t-elle déjà ?
        id: img_api
        run: |
          if aws ecr describe-images --repository-name api \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: L'image streamlit existe-t-elle déjà ?
        id: img_streamlit
        run: |
          if aws ecr describe-images --repository-name streamlit \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.img_api.outputs.exists == 'false' || steps.img_streamlit.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image api
        if: steps.img_api.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/Dockerfile
          push: true
          tags: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push de l'image streamlit
        if: steps.img_streamlit.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/app/Dockerfile
          push: true
          tags: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rendre le docker-compose.yml avec les tags de cette build
        run: |
          sed -i "s|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/api:.*|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/api:${{ github.sha }}|" docker/app_api/docker-compose.yml
          sed -i "s|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/streamlit:.*|image: 844099234486.dkr.ecr.eu-west-3.amazonaws.com/streamlit:${{ github.sha }}|" docker/app_api/docker-compose.yml
          grep -q "api:${{ github.sha }}" docker/app_api/docker-compose.yml \
            || { echo "::error::Le tag api n'a pas été injecté"; exit 1; }
          grep -q "streamlit:${{ github.sha }}" docker/app_api/docker-compose.yml \
            || { echo "::error::Le tag streamlit n'a pas été injecté"; exit 1; }
      
      - name: IP publique du runner
        id: ip
        run: |
          IP=$(curl -sf https://checkip.amazonaws.com | tr -d '[:space:]')
          test -n "$IP" || { echo "::error::Impossible de récupérer l'IP du runner"; exit 1; }
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Ouvrir SSH pour ce runner
        id: open_ssh
        env:
          SG_ID: ${{ secrets.APIAPP_SG_ID }}
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          test -n "$SG_ID" || { echo "::error::APIAPP_SG_ID non défini"; exit 1; }
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"

      - name: Copier docker-compose.yml et deploy.sh sur l'EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APIAPP_EC2_HOST }}
          username: ${{ secrets.APIAPP_EC2_USER }}
          key: ${{ secrets.APIAPP_EC2_SSH_KEY }}
          source: "docker/app_api/docker-compose.yml,docker/app_api/deploy.sh"
          strip_components: 2
          target: /tmp/app_api-deploy

      - name: Déploiement
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APIAPP_EC2_HOST }}
          username: ${{ secrets.APIAPP_EC2_USER }}
          key: ${{ secrets.APIAPP_EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            sudo mkdir -p /opt/app_api
            sudo mv /tmp/app_api-deploy/docker-compose.yml /opt/app_api/docker-compose.yml
            sudo mv /tmp/app_api-deploy/deploy.sh           /opt/app_api/deploy.sh
            sudo chown appuser:appuser /opt/app_api/docker-compose.yml /opt/app_api/deploy.sh
            sudo chmod +x /opt/app_api/deploy.sh
            sudo /opt/app_api/deploy.sh
            rm -rf /tmp/app_api-deploy

      - name: Refermer SSH
        if: always() && steps.open_ssh.outcome == 'success'
        env:
          SG_ID: ${{ secrets.APIAPP_SG_ID }}
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"